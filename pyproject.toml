[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vericall"
version = "0.1.0"
description = "VeriCall: Execution-Verified Post-Training for Tool Calling (QLoRA + DPO)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Bhuvnesh Sahu", email = "bhuvnesh@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "httpx>=0.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
train = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.6",
    "accelerate>=0.29.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vericall"]
